# Tests de la sonde, puis publication de l'image ghcr.io/baloodusudouest/frise:sonde
# (aussi en sonde-<version> et sonde-sha-<commit>). Le tag « latest » reste réservé à l'appli.
name: sonde
on:
  push:
    branches: [main]
    paths:
      - "sonde/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/sonde.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(grep -oP '__version__ = \"\K[^\"]+' sonde/sonde.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sonde
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/baloodusudouest/frise:sonde
            ghcr.io/baloodusudouest/frise:sonde-${{ steps.v.outputs.version }}
            ghcr.io/baloodusudouest/frise:sonde-sha-${{ github.sha }}
          cache-from: type=gha,scope=sonde
          cache-to: type=gha,mode=max,scope=sonde
      - name: Contrôle de l'image publiée
        run: |
          docker run --rm --entrypoint python ghcr.io/baloodusudouest/frise:sonde-sha-${{ github.sha }} \
            -c "import requests; print('requests', requests.__version__)"
