# Construit l'image et la publie sur ghcr.io à chaque push sur main
name: Image Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rien n'est publié si les tests échouent : ceux du serveur, puis ceux de l'écran (PC et iPhone)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/interface
      - run: cd frontend && npm ci && npx vite build
      - name: Tests d'écran
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          python -m pytest -q tests/interface
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Étiquettes : latest, la version (app/__init__.py) et le commit, pour revenir en arrière dans Portainer
      - name: Étiquettes de l'image
        id: etiquettes
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          depot=ghcr.io/${{ github.repository_owner }}/sillage
          echo "tags=$depot:latest,$depot:$version,$depot:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
